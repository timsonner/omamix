# Client of the private PipeWire socket, not a second daemon.
# The harness sets PIPEWIRE_REMOTE to the literal
# ${XDG_RUNTIME_DIR}/omamix-private-0 for this process only, so Pulse
# sees Mix Mic. The listen address is the private pulse socket.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 1024
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 rt.prio = 88 rtportal.enabled = false rtkit.enabled = false }
        flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse }
]
pulse.properties = {
    server.address = [
        "unix:omamix-private-pulse"
    ]
    server.dbus-name = "org.omamix.PrivatePulse"
}
