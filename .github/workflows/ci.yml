name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # No pipewire-feature job. ubuntu-24.04's apt libpipewire is 1.0.5, and
  # pipewire-rs 0.10 / v1_2_0 needs >= 1.2 (E0425 on spa_meta_sync_timeline).
  # An Arch container would also need a rolling pacman upgrade to get a new
  # enough libpipewire, which is not a reliable pin. The feature build runs
  # on the Arch dev machine (libpipewire 1.6.8). See the README.
