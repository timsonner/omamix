[package]
name = "omamix"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "PipeWire live mixer with one virtual microphone"

[[bin]]
name = "omamix"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]
pipewire = ["omamix-pw/pipewire"]

[dependencies]
eframe = { version = "0.36.2", optional = true }
egui = { version = "0.36.2", optional = true }
omamix-core = { workspace = true }
omamix-pw = { workspace = true }
